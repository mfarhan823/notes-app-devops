<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Notes<span class="dot-accent">.</span></h1>
    <div class="search-pill">
      <input type="text" id="searchInput" placeholder="Search...">
    </div>
    <span id="noteCount">0</span>
  </header>

  <main class="board" id="board"></main>

  <div class="empty-state" id="emptyState">
    <p>Nothing here yet.</p>
    <span>Tap + to write your first note</span>
  </div>

  <button id="fab">+</button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <input type="text" id="titleInput" placeholder="Title">
      <textarea id="bodyInput" placeholder="Write something..."></textarea>

      <div class="colour-row" id="colourPicker">
        <span class="dot active" data-color="#2a2d3a" style="background:#2a2d3a"></span>
        <span class="dot" data-color="#3d2a4a" style="background:#3d2a4a"></span>
        <span class="dot" data-color="#1f3a3a" style="background:#1f3a3a"></span>
        <span class="dot" data-color="#3a2a2a" style="background:#3a2a2a"></span>
        <span class="dot" data-color="#3a3520" style="background:#3a3520"></span>
      </div>

      <div class="modal-actions">
        <button id="cancelBtn">Cancel</button>
        <button id="saveBtn">Save Note</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
